always_deny:
  - pattern: "rm -rf /|shutdown|reboot|halt"
    reason: "Host-destructive commands are out of scope for the SRE harness"
  - pattern: "kubectl delete (ns|namespace|pv|pvc)"
    reason: "Namespace and volume deletion is denied"
  - pattern: "FLUSHALL|DROP DATABASE|terraform destroy"
    reason: "Irreversible wipe commands are denied"

always_allow:
  - pattern: "observe_health|fetch_logs|cloud_identity|list_skills|load_skill|list_business_units|list_services|resolve_service"
    reason: "Read-only observation is always allowed"
  - pattern: "^kubectl (get|describe|logs|top) "
    reason: "Read-only Kubernetes inspection is allowed"

ask_user:
  - pattern: "rollback_deploy|page_oncall"
    reason: "Customer-facing incident actions require an operator"
  - pattern: "kubectl (drain|cordon|delete|scale|rollout undo)"
    reason: "Cluster mutation requires confirmation"
  - pattern: "aws |az |gcloud "
    reason: "Cloud CLI writes or ambiguous invocations require confirmation"
